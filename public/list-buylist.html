<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Buylist Analysis</title>
    <!-- We'll create this CSS file next -->
    <link rel="icon" href="/media/favicon.png" type="image/png">
    <link rel="stylesheet" href="/list-buylist.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="list-name-header">List Analysis</h1>
            <div class="controls">
                <button id="scrape-all-btn">Scrape All Items</button>
                <div id="progress-container" class="progress-container hidden">
                    <div id="progress-bar" class="progress-bar"></div>
                    <span id="progress-text">Scraping 0 / 0</span>
                </div>
            </div>
        </header>

        <section class="target-control">
            <label for="tcg-low-slider">% of TCG Low</label>
            <div class="slider-wrapper">
                <input type="range" id="tcg-low-slider" min="50" max="105" step="1" value="85">
                <span id="tcg-low-slider-value">85%</span>
            </div>
            <p class="target-hint">Adjust your target discount to highlight buylist offers that beat it.</p>
        </section>

        <main id="analysis-container">
            <p>Loading list data...</p>
        </main>
    </div>

    <!-- The new JavaScript file will power this page -->
    <script src="/list-buylist.js"></script>
</body>
</html>
