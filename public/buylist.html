<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buylist Opportunities</title>
    <link rel="icon" href="/media/favicon.png" type="image/png">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/buylist.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Buylist Opportunities</h1>
            <div class="controls">
                <button id="buylist-refresh-btn" class="primary-btn">Refresh now</button>
                <span class="muted">Last updated: <span id="buylist-updated">--</span></span>
            </div>
        </header>

        <section id="buylist-summary" class="summary">Loading...</section>
        <main id="buylist-list" class="buylist-table">
            <div class="table-header">
                <span>Card</span>
                <span>TCG Low+Ship</span>
                <span>CK Buylist</span>
                <span>SCG Buylist</span>
                <span>Spread</span>
            </div>
            <div class="table-body" id="buylist-table-body">
                <p class="empty">Loading buylist report...</p>
            </div>
        </main>
    </div>

    <script src="/buylist-report.js"></script>
</body>
</html>
