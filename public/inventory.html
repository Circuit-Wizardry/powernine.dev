<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="icon" href="/media/favicon.png" type="image/png">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/inventory-style.css">
    <link rel="stylesheet" href="/card-search.css">
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Inventory Management</h1>
            <div class="header-controls">
                <button id="export-inventory-btn" class="action-btn export-btn">Export as TXT</button>
                <button id="open-buylist-modal" class="secondary-btn" type="button">Buylist Analysis</button>
                <a href="/" class="back-button">&larr; Back to Home</a>
            </div>
        </div>
        <div class="inventory-filter">
            <input type="search" id="inventory-filter" class="filter-input" placeholder="Filter inventory by name, set, condition..." aria-label="Filter inventory">
        </div>
    </div>

    <div class="add-card-section">
        <h2>Add to Inventory</h2>
        <div class="add-card-form">
            <input type="text" id="add-card-search" class="search-input" placeholder="Search for a card to add...">
            <div id="add-card-results"></div>
        </div>
    </div>

    <p id="inventory-filter-empty" class="empty-list-message" hidden>No inventory items match your filter.</p>

    <div id="inventory-container">
        </div>

    <div id="export-modal" class="export-modal">
        <div class="export-modal__content">
            <button type="button" id="export-modal-close" class="export-modal__close" aria-label="Close export text popup">&times;</button>
            <h2>Inventory TXT Export</h2>
            <p>Press <strong>Ctrl + A</strong>, then <strong>Ctrl + C</strong> (or use your device's copy controls) to copy the text below.</p>
            <textarea id="export-modal-text" readonly></textarea>
        </div>
    </div>

    <div id="buylist-modal" class="buylist-modal hidden" aria-hidden="true">
        <div class="buylist-modal-backdrop" data-dismiss="buylist-modal"></div>
        <div class="buylist-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="buylist-modal-title">
            <header class="buylist-modal-header">
                <div>
                    <h2 id="buylist-modal-title">Buylist Analysis</h2>
                    <p id="buylist-modal-subtitle" class="buylist-modal-subtitle"></p>
                </div>
                <button id="buylist-close-btn" class="modal-close-btn" type="button" aria-label="Close buylist analysis">&times;</button>
            </header>
            <div class="buylist-modal-controls">
                <button id="buylist-run-btn" class="primary-btn" type="button">Run Analysis</button>
                <div id="buylist-progress" class="buylist-progress hidden" aria-live="polite">
                    <div class="buylist-progress-bar-container">
                        <div class="buylist-progress-fill" id="buylist-progress-bar"></div>
                    </div>
                    <span id="buylist-progress-text">0 / 0</span>
                </div>
                <div class="buylist-slider-group">
                    <label for="buylist-target-slider">% of TCG Low</label>
                    <div class="buylist-slider">
                        <input type="range" id="buylist-target-slider" min="50" max="105" step="1" value="85">
                        <span id="buylist-target-value">85%</span>
                    </div>
                </div>
                <div class="buylist-sort-group">
                    <label for="buylist-sort-select">Sort</label>
                    <select id="buylist-sort-select">
                        <option value="margin-percent-desc">Margin (%)</option>
                        <option value="margin-dollar-desc">Margin ($)</option>
                        <option value="ck-desc">CK Buylist (High - Low)</option>
                        <option value="tcg-asc">TCG Low (Low - High)</option>
                        <option value="name-asc">Name (A - Z)</option>
                    </select>
                </div>
            </div>
            <div id="buylist-analysis-container" class="buylist-analysis-container">
                <p class="buylist-empty-state">Run analysis to populate results.</p>
            </div>
            <footer class="buylist-modal-footer">
                <span id="buylist-snapshot-status" class="buylist-snapshot-status"></span>
            </footer>
        </div>
    </div>

    <script src="/js/client-utils.js"></script>
    <script src="/js/buylist-modal.js"></script>
    <script src="/inventory.js"></script>
</body>
</html>
